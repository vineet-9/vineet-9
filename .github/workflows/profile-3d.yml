name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    name: Generate 30-Day Contribution Graph

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate 30-day 3D contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/generate-30d-contrib.mjs

      - name: Commit generated graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add profile-3d-contrib/profile-night-green.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "generated 30-day contribution graph"
            git push
          fi
