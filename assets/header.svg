<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Vineet Manage - Cybersecurity, Software Development, Digital Forensics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}@keyframes bl{50%{opacity:.15}}
.g1{animation:gl1 5s infinite steps(1);opacity:0}
.g2{animation:gl2 5s infinite steps(1);opacity:0}
@keyframes gl1{0%,90%,100%{transform:translate(0,0);opacity:0}91%{transform:translate(-6px,2px);opacity:.85}93%{transform:translate(5px,-2px);opacity:.85}95%{transform:translate(-2px,1px);opacity:.85}96%{opacity:0}}
@keyframes gl2{0%,90%,100%{transform:translate(0,0);opacity:0}91.5%{transform:translate(6px,-2px);opacity:.85}94%{transform:translate(-5px,2px);opacity:.85}96%{opacity:0}}
.l{opacity:0;animation:cyc 12s infinite}
@keyframes cyc{0%{opacity:0;transform:translateY(6px)}4%,29%{opacity:1;transform:translateY(0)}33.3%,100%{opacity:0}}
.scan{animation:scn 6s linear infinite}
@keyframes scn{from{transform:translateY(-90px)}to{transform:translateY(330px)}}
.b1{animation:bl 1.4s infinite}.b2{animation:bl 2.1s infinite .5s}.b3{animation:bl 1.7s infinite 1s}
</style>
