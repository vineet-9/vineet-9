<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Method: collect, preserve, analyze, report" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}@keyframes bl{50%{opacity:.15}}.d{animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-12}}
.n{animation:pl 6s infinite}@keyframes pl{0%,25%,100%{stroke-opacity:.5;stroke-width:1}5%,20%{stroke-opacity:1;stroke-width:3}}</style>
