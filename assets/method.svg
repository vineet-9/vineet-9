<text x="289" y="60" font-size="12" fill="#8d8a80">02</text><text x="289" y="86" font-size="22" font-weight="800" letter-spacing="2" fill="#ece7d8">PRESERVE</text><text x="289" y="105" font-size="12" fill="#ffb703">keep integrity intact</text></g><g><rect class="n" style="animation-delay:3.0s" x="536" y="35" width="190" height="80" rx="10" fill="#11141b" stroke="#ffb703" stroke-opacity=".5"/>
